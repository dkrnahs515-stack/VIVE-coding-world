<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048 - VIVE Coding World</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;900&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color:#0d0d15;--panel-bg:#161625;--neon-primary:#00f0ff;--neon-secondary:#ff0055;--neon-yellow:#ffe600;--text-color:#fff }
        *{box-sizing:border-box;margin:0;padding:0;user-select:none}body{background:var(--bg-color);color:var(--text-color);font-family:'Noto Sans KR',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}.header-container{width:100%;max-width:420px;display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.btn-back{background:transparent;border:1px solid var(--neon-primary);color:var(--neon-primary);padding:8px 16px;border-radius:6px;font-weight:bold;text-decoration:none;font-size:.9rem;transition:.3s}.btn-back:hover{background:var(--neon-primary);color:#000;box-shadow:0 0 10px var(--neon-primary)}h1{font-family:'Orbitron',sans-serif;font-size:1.8rem;text-shadow:0 0 10px var(--neon-primary)}.game-wrapper{background:var(--panel-bg);border:2px solid rgba(0,240,255,.3);border-radius:18px;padding:20px;box-shadow:0 0 30px rgba(0,0,0,.8);display:flex;flex-direction:column;align-items:center;gap:15px}.score-board{display:flex;justify-content:space-around;width:100%;background:rgba(0,0,0,.4);padding:10px;border-radius:10px;font-family:'Orbitron',sans-serif}.score-item{display:flex;flex-direction:column;align-items:center}.score-label{font-size:.75rem;color:#888}.score-value{font-size:1.2rem;font-weight:bold;color:var(--neon-yellow)}.grid{display:grid;grid-template-columns:repeat(4,80px);gap:10px;background:#000;padding:10px;border-radius:10px}.cell{width:80px;height:80px;background:#1f2238;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:bold;font-family:'Orbitron',sans-serif}.btn-action{background:linear-gradient(135deg,var(--neon-primary),#0077ff);border:none;color:#000;padding:12px 30px;border-radius:25px;font-weight:bold;font-family:'Orbitron',sans-serif;cursor:pointer;transition:.2s;box-shadow:0 0 15px rgba(0,240,255,.4)}.btn-action:hover{transform:translateY(-2px);box-shadow:0 0 25px rgba(0,240,255,.7)}
    </style>
</head>
<body>
    <div class="header-container"><a href="../../index.html" class="btn-back">⬅ MAIN PORTAL</a><h1>2048</h1></div>
    <div class="game-wrapper">
        <div class="score-board"><div class="score-item"><span class="score-label">SCORE</span><span id="score" class="score-value">0</span></div></div>
        <div id="grid" class="grid"></div>
        <button class="btn-action" onclick="initGame()">RESTART GAME</button>
    </div>
    <script>
        const gridDisplay=document.getElementById('grid');
        const scoreDisplay=document.getElementById('score');
        let squares=[];let score=0;

        function createBoard(){gridDisplay.innerHTML='';squares=[];for(let i=0;i<16;i++){let square=document.createElement('div');square.classList.add('cell');square.innerHTML='';gridDisplay.appendChild(square);squares.push(square)}generate();generate()}
        function generate(){let randomNumber=Math.floor(Math.random()*squares.length);if(squares[randomNumber].innerHTML===''){squares[randomNumber].innerHTML=2;updateColors()}else generate()}
        function moveRight(){for(let i=0;i<16;i+=4){let row=[parseInt(squares[i].innerHTML)||0,parseInt(squares[i+1].innerHTML)||0,parseInt(squares[i+2].innerHTML)||0,parseInt(squares[i+3].innerHTML)||0];let filteredRow=row.filter(num=>num);let missing=4-filteredRow.length;let zeros=Array(missing).fill('');let newRow=zeros.concat(filteredRow);for(let j=0;j<4;j++)squares[i+j].innerHTML=newRow[j]||''}}
        function moveLeft(){for(let i=0;i<16;i+=4){let row=[parseInt(squares[i].innerHTML)||0,parseInt(squares[i+1].innerHTML)||0,parseInt(squares[i+2].innerHTML)||0,parseInt(squares[i+3].innerHTML)||0];let filteredRow=row.filter(num=>num);let missing=4-filteredRow.length;let zeros=Array(missing).fill('');let newRow=filteredRow.concat(zeros);for(let j=0;j<4;j++)squares[i+j].innerHTML=newRow[j]||''}}
        function combineRow(){for(let i=0;i<15;i++){if(i%4!==3&&squares[i].innerHTML===squares[i+1].innerHTML&&squares[i].innerHTML!==''){let combinedTotal=parseInt(squares[i].innerHTML)*2;squares[i].innerHTML=combinedTotal;squares[i+1].innerHTML='';score+=combinedTotal;scoreDisplay.innerText=score}}}
        function moveDown(){for(let i=0;i<4;i++){let column=[parseInt(squares[i].innerHTML)||0,parseInt(squares[i+4].innerHTML)||0,parseInt(squares[i+8].innerHTML)||0,parseInt(squares[i+12].innerHTML)||0];let filteredColumn=column.filter(num=>num);let missing=4-filteredColumn.length;let newColumn=Array(missing).fill('').concat(filteredColumn);squares[i].innerHTML=newColumn[0]||'';squares[i+4].innerHTML=newColumn[1]||'';squares[i+8].innerHTML=newColumn[2]||'';squares[i+12].innerHTML=newColumn[3]||''}}
        function moveUp(){for(let i=0;i<4;i++){let column=[parseInt(squares[i].innerHTML)||0,parseInt(squares[i+4].innerHTML)||0,parseInt(squares[i+8].innerHTML)||0,parseInt(squares[i+12].innerHTML)||0];let filteredColumn=column.filter(num=>num);let missing=4-filteredColumn.length;let newColumn=filteredColumn.concat(Array(missing).fill(''));squares[i].innerHTML=newColumn[0]||'';squares[i+4].innerHTML=newColumn[1]||'';squares[i+8].innerHTML=newColumn[2]||'';squares[i+12].innerHTML=newColumn[3]||''}}
        function combineColumn(){for(let i=0;i<12;i++){if(squares[i].innerHTML===squares[i+4].innerHTML&&squares[i].innerHTML!==''){let combinedTotal=parseInt(squares[i].innerHTML)*2;squares[i].innerHTML=combinedTotal;squares[i+4].innerHTML='';score+=combinedTotal;scoreDisplay.innerText=score}}}
        function control(e){if(e.keyCode===39){moveRight();combineRow();moveRight();generate()}else if(e.keyCode===37){moveLeft();combineRow();moveLeft();generate()}else if(e.keyCode===38){moveUp();combineColumn();moveUp();generate()}else if(e.keyCode===40){moveDown();combineColumn();moveDown();generate()}updateColors()}
        function updateColors(){squares.forEach(square=>{let val=square.innerHTML;if(!val)square.style.background='#1f2238';else if(val==2)square.style.background='#2a2e45';else if(val==4)square.style.background='#00f0ff';else if(val==8)square.style.background='#00ff66';else if(val==16)square.style.background='#ffe600';else if(val==32)square.style.background='#ff0055';else square.style.background='#b5179e'})}
        document.addEventListener('keyup',control);
        function initGame(){score=0;scoreDisplay.innerText=0;createBoard()}
        initGame();
    </script>
</body>
</html>
