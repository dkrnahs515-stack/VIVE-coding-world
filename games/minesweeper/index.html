<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>지뢰찾기 - VIVE Coding World</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;900&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d0d15;
            --panel-bg: #161625;
            --neon-primary: #00f0ff;
            --neon-secondary: #ff0055;
            --neon-yellow: #ffe600;
            --text-color: #ffffff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background-color: var(--bg-color); color: var(--text-color); font-family: 'Noto Sans KR', sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .header-container { width: 100%; max-width: 440px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn-back { background: transparent; border: 1px solid var(--neon-primary); color: var(--neon-primary); padding: 8px 16px; border-radius: 6px; font-weight: bold; text-decoration: none; font-size: 0.9rem; transition: all 0.3s; }
        .btn-back:hover { background: var(--neon-primary); color: #000; box-shadow: 0 0 10px var(--neon-primary); }
        h1 { font-family: 'Orbitron', sans-serif; font-size: 1.8rem; text-shadow: 0 0 10px var(--neon-primary); }
        .game-wrapper { background-color: var(--panel-bg); border: 2px solid rgba(0, 240, 255, 0.3); border-radius: 18px; padding: 20px; box-shadow: 0 0 30px rgba(0,0,0,0.8); display: flex; flex-direction: column; align-items: center; gap: 15px; }
        .score-board { display: flex; justify-content: space-around; width: 100%; background: rgba(0, 0, 0, 0.4); padding: 10px; border-radius: 10px; font-family: 'Orbitron', sans-serif; }
        .score-item { display: flex; flex-direction: column; align-items: center; }
        .score-label { font-size: 0.75rem; color: #888; }
        .score-value { font-size: 1.2rem; font-weight: bold; color: var(--neon-yellow); }
        .grid { display: grid; grid-template-columns: repeat(10, 36px); gap: 4px; }
        .cell { width: 36px; height: 36px; background: #1f2238; border: 1px solid rgba(255,255,255,0.05); border-radius: 4px; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; font-family: 'Orbitron', sans-serif; }
        .cell.revealed { background: #2a2e45; border-color: var(--neon-primary); }
        .cell.mine { background: var(--neon-secondary); }
        .btn-action { background: linear-gradient(135deg, var(--neon-primary), #0077ff); border: none; color: #000; padding: 12px 30px; border-radius: 25px; font-weight: bold; font-family: 'Orbitron', sans-serif; cursor: pointer; transition: all 0.2s; box-shadow: 0 0 15px rgba(0, 240, 255, 0.4); }
        .btn-action:hover { transform: translateY(-2px); box-shadow: 0 0 25px rgba(0, 240, 255, 0.7); }
    </style>
</head>
<body>
    <div class="header-container">
        <a href="../../index.html" class="btn-back">⬅ MAIN PORTAL</a>
        <h1>MINESWEEPER</h1>
    </div>
    <div class="game-wrapper">
        <div class="score-board">
            <div class="score-item"><span class="score-label">MINES</span><span id="minesCount" class="score-value">10</span></div>
            <div class="score-item"><span class="score-label">TIME</span><span id="timerText" class="score-value">0s</span></div>
        </div>
        <div id="grid" class="grid"></div>
        <button class="btn-action" onclick="initGame()">RESET GAME</button>
    </div>
    <script>
        const width = 10;
        const minesTotal = 10;
        let grid = document.getElementById('grid');
        let cells = [];
        let isGameOver = false;
        let timer = 0, timerInterval = null;

        function initGame() {
            grid.innerHTML = '';
            cells = [];
            isGameOver = false;
            clearInterval(timerInterval);
            timer = 0;
            document.getElementById('timerText').innerText = '0s';
            document.getElementById('minesCount').innerText = minesTotal;

            const minesArray = Array(minesTotal).fill('mine');
            const emptyArray = Array(width * width - minesTotal).fill('valid');
            const gameArray = shuffle([...minesArray, ...emptyArray]);

            for (let i = 0; i < width * width; i++) {
                const cell = document.createElement('div');
                cell.setAttribute('id', i);
                cell.classList.add('cell');
                cell.dataset.type = gameArray[i];
                grid.appendChild(cell);
                cells.push(cell);

                cell.addEventListener('click', () => click(cell));
                cell.oncontextmenu = (e) => {
                    e.preventDefault();
                    addFlag(cell);
                };
            }

            for (let i = 0; i < cells.length; i++) {
                let total = 0;
                const isLeftEdge = (i % width === 0);
                const isRightEdge = (i % width === width - 1);

                if (cells[i].dataset.type === 'valid') {
                    if (i > 0 && !isLeftEdge && cells[i - 1].dataset.type === 'mine') total++;
                    if (i > 8 && !isRightEdge && cells[i + 1 - width].dataset.type === 'mine') total++;
                    if (i > 9 && cells[i - width].dataset.type === 'mine') total++;
                    if (i > 10 && !isLeftEdge && cells[i - 1 - width].dataset.type === 'mine') total++;
                    if (i < 98 && !isRightEdge && cells[i + 1].dataset.type === 'mine') total++;
                    if (i < 90 && !isLeftEdge && cells[i - 1 + width].dataset.type === 'mine') total++;
                    if (i < 89 && !isRightEdge && cells[i + 1 + width].dataset.type === 'mine') total++;
                    if (i < 90 && cells[i + width].dataset.type === 'mine') total++;
                    cells[i].setAttribute('data', total);
                }
            }
        }

        function shuffle(array) {
            return array.sort(() => Math.random() - 0.5);
        }

        function addFlag(cell) {
            if (isGameOver || cell.classList.contains('revealed')) return;
            if (!cell.classList.contains('flag')) {
                cell.classList.add('flag');
                cell.innerHTML = '🚩';
            } else {
                cell.classList.remove('flag');
                cell.innerHTML = '';
            }
        }

        function click(cell) {
            let currentId = cell.id;
            if (isGameOver || cell.classList.contains('revealed') || cell.classList.contains('flag')) return;

            if (!timerInterval) {
                timerInterval = setInterval(() => { timer++; document.getElementById('timerText').innerText = `${timer}s`; }, 1000);
            }

            if (cell.dataset.type === 'mine') {
                gameOver(cell);
            } else {
                let total = cell.getAttribute('data');
                if (total != 0) {
                    cell.classList.add('revealed');
                    cell.innerHTML = total;
                    checkWin();
                    return;
                }
                checkCell(currentId);
            }
            cell.classList.add('revealed');
            checkWin();
        }

        function checkCell(currentId) {
            const i = parseInt(currentId);
            const isLeftEdge = (i % width === 0);
            const isRightEdge = (i % width === width - 1);

            setTimeout(() => {
                if (i > 0 && !isLeftEdge) click(cells[i - 1]);
                if (i > 8 && !isRightEdge) click(cells[i + 1 - width]);
                if (i > 9) click(cells[i - width]);
                if (i > 10 && !isLeftEdge) click(cells[i - 1 - width]);
                if (i < 98 && !isRightEdge) click(cells[i + 1]);
                if (i < 90 && !isLeftEdge) click(cells[i - 1 + width]);
                if (i < 89 && !isRightEdge) click(cells[i + 1 + width]);
                if (i < 90) click(cells[i + width]);
            }, 10);
        }

        function gameOver(cell) {
            isGameOver = true;
            clearInterval(timerInterval);
            cells.forEach(c => {
                if (c.dataset.type === 'mine') {
                    c.classList.add('mine');
                    c.innerHTML = '💣';
                }
            });
            alert('BOOM! GAME OVER');
        }

        function checkWin() {
            let matches = 0;
            for (let i = 0; i < cells.length; i++) {
                if (cells[i].classList.contains('revealed') && cells[i].dataset.type === 'valid') matches++;
            }
            if (matches === width * width - minesTotal) {
                isGameOver = true;
                clearInterval(timerInterval);
                alert('WINNER!');
            }
        }

        initGame();
    </script>
</body>
</html>
