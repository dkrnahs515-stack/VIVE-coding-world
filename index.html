<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Hub - 통합 미니게임 천국</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="portal-container">
        <!-- 1. 메인 게임 선택 메뉴 화면 -->
        <main id="menuView" class="view active">
            <header class="portal-header">
                <p class="subtitle">HTML5 CANVAS & WEB AUDIO</p>
                <h1>🕹️ ARCADE HUB</h1>
                <p class="description">플레이하고 싶은 게임을 선택하세요!</p>
            </header>

            <section class="game-grid">
                <!-- 게임 카드 1 -->
                <div class="game-card" onclick="launchGame('games/sword.html', '전설의 검 강화하기')">
                    <div class="card-icon">⚔️</div>
                    <div class="card-info">
                        <h3>전설의 검 강화하기</h3>
                        <p>강화, 판매, 리스크 관리 RPG</p>
                    </div>
                </div>

                <!-- 게임 카드 2 -->
                <div class="game-card" onclick="launchGame('games/wave.html', '네온 웨이브 서바이벌')">
                    <div class="card-icon">👾</div>
                    <div class="card-info">
                        <h3>네온 웨이브 서바이벌</h3>
                        <p>WASD + Space 2D 탑뷰 슈팅</p>
                    </div>
                </div>

                <!-- 게임 카드 3 -->
                <div class="game-card" onclick="launchGame('games/stairs.html', '무한의 계단')">
                    <div class="card-icon">🪜</div>
                    <div class="card-info">
                        <h3>무한의 계단</h3>
                        <p>300초 무한 계단 오르기 액션</p>
                    </div>
                </div>

                <!-- 게임 카드 4 -->
                <div class="game-card" onclick="launchGame('games/dash.html', '네온 큐브 대시')">
                    <div class="card-icon">⚡</div>
                    <div class="card-info">
                        <h3>네온 큐브 대시</h3>
                        <p>스테이지별 지오메트리 점프 러너</p>
                    </div>
                </div>
            </section>
        </main>

        <!-- 2. 게임 실제 실행 구역 (Iframe 탑재) -->
        <section id="gameView" class="view">
            <nav class="game-nav">
                <button class="btn-back" onclick="closeGame()">⬅️ 메인 메뉴로 돌아가기</button>
                <h2 id="currentGameTitle">게임 제목</h2>
            </nav>
            <div class="iframe-wrapper">
                <iframe id="gameFrame" src="" frameborder="0"></iframe>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
